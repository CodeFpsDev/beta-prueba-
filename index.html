<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          var _origFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return _origFetch; },
            set: function(val) { _origFetch = val; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}

        window.addEventListener('error', function(e) {
          if (
            (e.filename && e.filename.indexOf('chrome-extension://') !== -1) ||
            (e.message && e.message.indexOf('fetch of #<Window>') !== -1)
          ) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
    <meta name="theme-color" content="#F85800" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Zory Delivery</title>
    <meta name="description" content="Tu app de delivery favorita en Ayolas. Pedí comida, supermercado, farmacias y más con pedidos en tiempo real." />
    <meta property="og:title" content="Zory Delivery" />
    <meta property="og:description" content="Tu app de delivery favorita en Ayolas. Pedí comida, supermercado, farmacias y más con pedidos en tiempo real." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <script type="module" crossorigin src="./assets/index.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index.css">
    <script type="module" src="./zory-auth.js"></script>
  </head>
  <body class="bg-[#FFF3EA] text-gray-900 antialiased selection:bg-rose-500 selection:text-white">
    <div id="root"></div>
  </body>
</html>
